# =============================================================================
#  .github/workflows/publish.yml
#  Abordagem: usa o perfil .pubxml do ClickOnce que já existe no projeto
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Versão ────────────────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."
          echo "VERSION=$ver"                >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver → ClickOnce: $clickonce"

      # ── NuGet ─────────────────────────────────────────────────────────────
      - name: Restaurar NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── Criar o perfil .pubxml dinamicamente ──────────────────────────────
      - name: Criar perfil de publicação ClickOnce
        shell: pwsh
        run: |
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $workspace  = "${{ github.workspace }}"
          $publishDir = "$workspace\pages-out\"

          # Garante que a pasta do perfil existe
          $profileDir = "$workspace\Properties\PublishProfiles"
          New-Item -ItemType Directory -Force -Path $profileDir | Out-Null
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          $pubxml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project ToolsVersion="4.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <PropertyGroup>
              <PublishProtocol>ClickOnce</PublishProtocol>
              <PublishDir>$publishDir</PublishDir>
              <InstallUrl>$installUrl</InstallUrl>
              <ApplicationVersion>$version</ApplicationVersion>
              <UpdateEnabled>true</UpdateEnabled>
              <UpdateMode>Foreground</UpdateMode>
              <UpdateInterval>0</UpdateInterval>
              <UpdateIntervalUnits>Days</UpdateIntervalUnits>
              <UpdatePeriodically>false</UpdatePeriodically>
              <UpdateRequired>false</UpdateRequired>
              <MapFileExtensions>true</MapFileExtensions>
              <SignManifests>false</SignManifests>
              <BootstrapperEnabled>false</BootstrapperEnabled>
              <GenerateBootstrapper>false</GenerateBootstrapper>
              <PublisherName>p4rzv4l</PublisherName>
              <ProductName>D365 Support Assistant</ProductName>
              <SupportUrl>$installUrl</SupportUrl>
              <WebPage>index.html</WebPage>
              <OpenBrowserOnPublish>false</OpenBrowserOnPublish>
              <CreateDesktopShortcut>true</CreateDesktopShortcut>
              <CreateWebPageOnPublish>false</CreateWebPageOnPublish>
              <ApplicationRevision>0</ApplicationRevision>
              <Configuration>Release</Configuration>
              <Platform>x64</Platform>
              <TargetFramework>net8.0-windows10.0.17763.0</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>false</SelfContained>
            </PropertyGroup>
          </Project>
          "@

          $pubxml | Out-File -FilePath "$profileDir\CI.pubxml" -Encoding UTF8
          Write-Host "✓ Perfil criado em $profileDir\CI.pubxml"
          Write-Host "✓ PublishDir: $publishDir"

      # ── Publicar via MSBuild com o perfil ─────────────────────────────────
      - name: Publicar ClickOnce
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $publishDir = "$workspace\pages-out\"

          Write-Host "→ Executando MSBuild /t:Publish..."

          msbuild D365SupportAssistant.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PublishProfile=CI `
            /p:PublishDir="$publishDir" `
            /p:SignManifests=false `
            /p:GenerateBootstrapper=false `
            /p:BootstrapperEnabled=false `
            /p:Publish=true `
            /v:minimal `
            /nologo

          Write-Host ""
          Write-Host "=== MSBuild exit: $LASTEXITCODE ==="
          Write-Host ""
          Write-Host "=== Buscando .application em todo workspace ==="
          Get-ChildItem -Recurse $workspace -Filter "*.application" -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host ""
          Write-Host "=== Conteúdo de pages-out ==="
          if (Test-Path $publishDir) {
            Get-ChildItem -Recurse $publishDir | Select-Object FullName
          } else {
            Write-Host "VAZIO"
          }

          Write-Host ""
          Write-Host "=== Conteúdo de bin\Release (app.publish) ==="
          Get-ChildItem -Recurse "bin\Release" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "\.(application|deploy|manifest)$" } |
            Select-Object FullName

          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

      # ── Localizar arquivos ClickOnce onde quer que estejam ────────────────
      - name: Localizar e copiar arquivos
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          $dest      = "$workspace\pages-out"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # Procura .application em qualquer lugar
          $appFile = Get-ChildItem -Recurse $workspace `
                       -Filter "*.application" -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -notlike "*\obj\*" } |
                     Select-Object -First 1

          if (-not $appFile) {
            Write-Host "✗ .application não encontrado"

            # Fallback: tenta bin\Release\...\app.publish
            $appPublish = Get-ChildItem -Recurse "bin\Release" `
                            -Filter "app.publish" -ErrorAction SilentlyContinue |
                          Select-Object -First 1

            if ($appPublish) {
              Write-Host "✓ Encontrado app.publish em: $($appPublish.FullName)"
              Copy-Item -Recurse -Force "$($appPublish.FullName)\*" $dest
            } else {
              Write-Error "✗ Nenhum arquivo ClickOnce encontrado. Verifique os logs acima."
              exit 1
            }
          } else {
            $sourceDir = $appFile.DirectoryName
            Write-Host "✓ .application encontrado em: $sourceDir"

            # Se já está no dest, não precisa copiar
            if ($sourceDir -ne $dest) {
              Copy-Item -Recurse -Force "$sourceDir\*" $dest
              Write-Host "✓ Copiado para $dest"
            }
          }

          Write-Host ""
          Write-Host "=== Conteúdo final de pages-out ==="
          Get-ChildItem $dest | Select-Object Name, Length

      # ── index.html ────────────────────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $date    = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest    = "${{ github.workspace }}\pages-out"

          $html = @"
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>D365 Support Assistant</title>
            <style>
              *{box-sizing:border-box;margin:0;padding:0}
              body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;
                   display:flex;align-items:center;justify-content:center;min-height:100vh}
              .card{background:#161B22;border:1px solid #30363D;border-radius:12px;
                    padding:40px 48px;max-width:560px;width:100%;text-align:center}
              .logo{font-size:48px;margin-bottom:16px}
              h1{font-size:24px;font-weight:700;margin-bottom:8px}
              .ver{display:inline-block;background:#7C3AED22;color:#A78BFA;
                   border:1px solid #7C3AED55;border-radius:20px;
                   padding:4px 16px;font-size:13px;margin-bottom:24px}
              p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}
              .btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;
                   padding:14px 32px;border-radius:8px;font-size:16px;
                   font-weight:600;margin-bottom:12px}
              .btn:hover{background:#6D28D9}
              .note{background:#0D1117;border:1px solid #30363D;border-radius:8px;
                    padding:12px 16px;font-size:12px;color:#484F58;text-align:left}
              .note strong{color:#8B949E}
              .date{font-size:11px;color:#30363D;margin-top:20px}
            </style>
          </head>
          <body>
            <div class="card">
              <div class="logo">📊</div>
              <h1>D365 Support Assistant</h1>
              <span class="ver">v$version</span>
              <p>Monitor de chamados para Microsoft Dynamics 365.<br>
                 Alertas automáticos, tracker de tempo e análise por IA.</p>
              <a class="btn" href="D365SupportAssistant.application">
                ⬇ Instalar via ClickOnce
              </a>
              <div class="note">
                <strong>Requisito:</strong> Windows 10/11 64-bit +
                <a href="https://dotnet.microsoft.com/download/dotnet/8.0"
                   style="color:#58A6FF">.NET 8 Desktop Runtime</a><br><br>
                <strong>Atualização automática:</strong> o app verifica novas
                versões ao iniciar e atualiza sozinho.
              </div>
              <div class="date">Publicado em $date · v$version</div>
            </div>
          </body>
          </html>
          "@

          $html | Out-File -FilePath "$dest\index.html" -Encoding UTF8
          Write-Host "✓ index.html criado"

      # ── Upload Pages ──────────────────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URLs
        run: |
          echo "✅ https://p4rzv4l.github.io/D365SupportAssistant/"