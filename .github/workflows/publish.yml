# =============================================================================
#  .github/workflows/publish.yml
#  Estratégia: MSBuild /t:Publish com ClickOnceProfile.pubxml
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Versão ────────────────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."
          echo "VERSION=$ver"                >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver → ClickOnce: $clickonce"

      # ── NuGet ─────────────────────────────────────────────────────────────
      - name: Restaurar NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── Importar certificado no store ────────────────────────────────────
      - name: Importar certificado no store
        shell: pwsh
        run: |
          $pfxPath = "${{ github.workspace }}\D365SupportAssistant.pfx"
          $pfxPwd  = ConvertTo-SecureString "Shouko3613968743#" -AsPlainText -Force
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfxPath, "Shouko3613968743#", "MachineKeySet,PersistKeySet,Exportable"
          )
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My","CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Write-Host "✓ Certificado importado: $($cert.Thumbprint)"
          echo "CERT_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
        id: cert

      # ── Publicar via MSBuild ClickOnce (sem .pubxml) ─────────────────────
      - name: Publicar ClickOnce via MSBuild
        shell: pwsh
        run: |
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $appPublish = "${{ github.workspace }}\bin\Release\net8.0-windows10.0.17763.0\app.publish"

          Write-Host "→ MSBuild /t:Publish versão $version"

          msbuild D365SupportAssistant.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:Platform="Any CPU" `
            /p:PublishProtocol=ClickOnce `
            /p:ApplicationVersion=$version `
            /p:InstallUrl=$installUrl `
            /p:UpdateUrl=$installUrl `
            /p:UpdateEnabled=true `
            /p:UpdateMode=Foreground `
            /p:Install=true `
            /p:IsWebBootstrapper=false `
            /p:MapFileExtensions=true `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ steps.cert.outputs.CERT_THUMB }}" `
            /p:GenerateManifests=true `
            /p:BootstrapperEnabled=false `
            /p:ApplicationIcon= `
            /p:SelfContained=false `
            /p:PublishSingleFile=false `
            /nologo `
            /v:m

          if ($LASTEXITCODE -ne 0) {
            Write-Error "✗ MSBuild falhou"
            exit 1
          }
          Write-Host "✓ MSBuild concluído"

          # Procura o .application gerado
          Write-Host "=== Procurando .application no workspace ==="
          Get-ChildItem -Recurse "${{ github.workspace }}" -Filter "*.application" -ErrorAction SilentlyContinue |
            Select-Object FullName
          Write-Host "=== Procurando pasta app.publish ==="
          Get-ChildItem -Recurse "${{ github.workspace }}" -Filter "app.publish" -ErrorAction SilentlyContinue |
            Select-Object FullName

      # ── Montar pages-out ──────────────────────────────────────────────────
      - name: Montar pages-out
        shell: pwsh
        run: |
          $workspace = "${{ github.workspace }}"
          $pagesDir  = "$workspace\pages-out"

          # O MSBuild gera a estrutura ClickOnce correta em publish          # Esta pasta tem: D365SupportAssistant.application, Launcher.exe, Application Files          $publishDir = "$workspace\publish"
          if (-not (Test-Path $publishDir)) {
            Write-Error "✗ pasta publish nao encontrada no workspace"
            exit 1
          }

          # Usa publish\ diretamente como pages-out
          if (Test-Path $pagesDir) { Remove-Item -Recurse -Force $pagesDir }
          Copy-Item -Recurse -Force $publishDir $pagesDir
          Write-Host "OK pages-out criado a partir de publish"

          # Garante nome correto do .application
          $appFile = Get-ChildItem $pagesDir -Filter "*.application" | Select-Object -First 1
          if (-not $appFile) {
            Write-Error "x .application nao encontrado em pages-out"
            exit 1
          }
          if ($appFile.Name -ne "D365SupportAssistant.application") {
            Rename-Item $appFile.FullName "D365SupportAssistant.application"
          }
          Write-Host "OK $($appFile.Name) pronto"

          Write-Host "=== Conteudo final de pages-out ==="
          Get-ChildItem $pagesDir | Select-Object Name

      # ── Criar index.html ──────────────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $date     = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest     = "${{ github.workspace }}\pages-out"
          $html  = '<!DOCTYPE html>'
          $html += '<html lang="pt-BR"><head>'
          $html += '<meta charset="UTF-8">'
          $html += '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          $html += '<title>D365 Support Assistant</title>'
          $html += '<style>'
          $html += '*{box-sizing:border-box;margin:0;padding:0}'
          $html += "body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;"
          $html += 'display:flex;align-items:center;justify-content:center;min-height:100vh}'
          $html += '.card{background:#161B22;border:1px solid #30363D;border-radius:12px;'
          $html += 'padding:40px 48px;max-width:560px;width:100%;text-align:center}'
          $html += '.logo{font-size:48px;margin-bottom:16px}'
          $html += 'h1{font-size:24px;font-weight:700;margin-bottom:8px}'
          $html += '.ver{display:inline-block;background:#7C3AED22;color:#A78BFA;'
          $html += 'border:1px solid #7C3AED55;border-radius:20px;'
          $html += 'padding:4px 16px;font-size:13px;margin-bottom:24px}'
          $html += 'p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}'
          $html += '.btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;'
          $html += 'padding:14px 32px;border-radius:8px;font-size:16px;'
          $html += 'font-weight:600;margin-bottom:12px}'
          $html += '.btn:hover{background:#6D28D9}'
          $html += '.btn2{display:block;color:#58A6FF;text-decoration:none;'
          $html += 'padding:10px 32px;border-radius:8px;font-size:14px;'
          $html += 'border:1px solid #30363D;margin-bottom:24px}'
          $html += '.note{background:#0D1117;border:1px solid #30363D;border-radius:8px;'
          $html += 'padding:12px 16px;font-size:12px;color:#484F58;text-align:left}'
          $html += '.note strong{color:#8B949E}'
          $html += '.date{font-size:11px;color:#30363D;margin-top:20px}'
          $html += '</style></head><body>'
          $html += '<div class="card">'
          $html += '<div class="logo">📊</div>'
          $html += '<h1>D365 Support Assistant</h1>'
          $html += "<span class=`"ver`">v$version</span>"
          $html += '<p>Monitor de chamados para Microsoft Dynamics 365.<br>'
          $html += 'Alertas automáticos, tracker de tempo e análise por IA.</p>'
          $html += '<a class="btn" href="D365SupportAssistant.application">⬇ Instalar via ClickOnce</a>'
          $html += '<a class="btn2" href="https://dotnet.microsoft.com/download/dotnet/8.0">📦 Baixar .NET 8 Runtime (necessário)</a>'
          $html += '<div class="note">'
          $html += '<strong>Requisitos:</strong> Windows 10/11 64-bit + .NET 8 Desktop Runtime<br><br>'
          $html += '<strong>Atualização automática:</strong> o app verifica novas versões ao iniciar.'
          $html += '</div>'
          $html += "<div class=`"date`">Publicado em $date · v$version</div>"
          $html += '</div></body></html>'
          [System.IO.File]::WriteAllText("$dest\index.html", $html, [System.Text.Encoding]::UTF8)
          Write-Host "✓ index.html criado"

      # ── Upload GitHub Pages ───────────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URLs finais
        run: |
          echo "================================================"
          echo "✅ Publicado com sucesso!"
          echo "📦 https://p4rzv4l.github.io/D365SupportAssistant/"
          echo "🔗 https://p4rzv4l.github.io/D365SupportAssistant/D365SupportAssistant.application"
          echo "================================================"