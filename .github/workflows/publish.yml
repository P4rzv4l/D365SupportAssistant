# =============================================================================
#  .github/workflows/publish.yml
#  Estratégia: dotnet publish normal → gera manifests ClickOnce separadamente
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Versão ────────────────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."
          echo "VERSION=$ver"                >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver → ClickOnce: $clickonce"

      # ── NuGet ─────────────────────────────────────────────────────────────
      - name: Restaurar NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── PASSO 1: dotnet publish normal (gera os binários) ─────────────────
      - name: Build e Publish binários
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $binDir     = "$workspace\bin-out"
          Write-Host "→ dotnet publish → $binDir"
          dotnet publish D365SupportAssistant.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$binDir" `
            --nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Error "✗ dotnet publish falhou"
            exit 1
          }
          Write-Host "✓ Binários gerados em $binDir"
          Get-ChildItem $binDir | Select-Object Name | Format-Table -AutoSize

      # ── PASSO 2: Gerar manifests ClickOnce via mage.exe ──────────────────
      - name: Gerar manifests ClickOnce com mage.exe
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $binDir     = "$workspace\bin-out"
          $appDir     = "$workspace\pages-out\Application Files\D365SupportAssistant_$($version.Replace('.','_'))"
          $pagesDir   = "$workspace\pages-out"

          New-Item -ItemType Directory -Force -Path $appDir  | Out-Null
          New-Item -ItemType Directory -Force -Path $pagesDir | Out-Null

          # Copia binários para a pasta de versão do ClickOnce
          Copy-Item -Recurse -Force "$binDir\*" "$appDir\"
          Write-Host "✓ Binários copiados para $appDir"

          # ── Coleta hashes SHA256 de todos os arquivos para o manifest ──────
          $fileEntries = ''
          Get-ChildItem -Recurse $appDir -File | ForEach-Object {
            $relPath = $_.FullName.Substring($appDir.Length + 1).Replace('\','/')
            $sha256  = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $b64hash = [Convert]::ToBase64String(([byte[]] -split ($sha256 -replace '..', '0x$& ')))
            $size    = $_.Length
            $deployName = if ($_.Extension -eq '.manifest') { $relPath } else { "$relPath.deploy" }
            $fileEntries += "  <file name=`"$deployName`" size=`"$size`">`r`n"
            $fileEntries += "    <hash xmlns:dsig=`"http://www.w3.org/2000/09/xmldsig#`">`r`n"
            $fileEntries += "      <dsig:Transforms><dsig:Transform Algorithm=`"urn:schemas-microsoft-com:HashTransforms.Identity`"/></dsig:Transforms>`r`n"
            $fileEntries += "      <dsig:DigestMethod Algorithm=`"http://www.w3.org/2000/09/xmldsig#sha256`"/>`r`n"
            $fileEntries += "      <dsig:DigestValue>$b64hash</dsig:DigestValue>`r`n"
            $fileEntries += "    </hash>`r`n"
            $fileEntries += "  </file>`r`n"
          }

          # ── Gera .exe.manifest manualmente (sem customHostSpecified) ────────
          $appManifestPath = "$appDir\D365SupportAssistant.exe.manifest"
          $appManifestXml  = '<?xml version="1.0" encoding="utf-8"?>' + "`r`n"
          $appManifestXml += '<asmv1:assembly manifestVersion="1.0"' + "`r`n"
          $appManifestXml += '  xmlns:asmv1="urn:schemas-microsoft-com:asm.v1"' + "`r`n"
          $appManifestXml += '  xmlns="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $appManifestXml += '  xmlns:asmv2="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $appManifestXml += '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' + "`r`n"
          $appManifestXml += '  xmlns:co.v1="urn:schemas-microsoft-com:clickonce.v1"' + "`r`n"
          $appManifestXml += '  xmlns:co.v2="urn:schemas-microsoft-com:clickonce.v2">' + "`r`n"
          $appManifestXml += "  <assemblyIdentity name=`"D365SupportAssistant.exe`" version=`"$version`" language=`"neutral`" processorArchitecture=`"amd64`" xmlns=`"urn:schemas-microsoft-com:asm.v1`"/>`r`n"
          $appManifestXml += "  <description asmv2:iconFile=`"`" xmlns=`"urn:schemas-microsoft-com:asm.v1`"/>`r`n"
          $appManifestXml += '  <application/>' + "`r`n"
          $appManifestXml += '  <entryPoint>' + "`r`n"
          $appManifestXml += "    <assemblyIdentity name=`"D365SupportAssistant`" version=`"$version`" language=`"neutral`" processorArchitecture=`"amd64`"/>`r`n"
          $appManifestXml += "    <commandLine file=`"D365SupportAssistant.exe`" parameters=`"`"/>`r`n"
          $appManifestXml += '  </entryPoint>' + "`r`n"
          $appManifestXml += '  <trustInfo xmlns="urn:schemas-microsoft-com:asm.v2">' + "`r`n"
          $appManifestXml += '    <security><applicationRequestMinimum>' + "`r`n"
          $appManifestXml += '      <PermissionSet Unrestricted="true" ID="Custom" SameSite="site"/>' + "`r`n"
          $appManifestXml += '    </applicationRequestMinimum></security>' + "`r`n"
          $appManifestXml += '  </trustInfo>' + "`r`n"
          $appManifestXml += '  <dependency>' + "`r`n"
          $appManifestXml += '    <dependentOS><osVersionInfo><os majorVersion="6" minorVersion="0" buildNumber="0" servicePackMajor="0"/></osVersionInfo></dependentOS>' + "`r`n"
          $appManifestXml += '  </dependency>' + "`r`n"
          $appManifestXml += '  <dependency>' + "`r`n"
          $appManifestXml += '    <dependentAssembly dependencyType="preRequisite" allowDelayedBinding="true">' + "`r`n"
          $appManifestXml += '      <assemblyIdentity name="Microsoft.Windows.CommonLanguageRuntime" version="4.0.0.0"/>' + "`r`n"
          $appManifestXml += '    </dependentAssembly>' + "`r`n"
          $appManifestXml += '  </dependency>' + "`r`n"
          $appManifestXml += $fileEntries
          $appManifestXml += '</asmv1:assembly>'
          [System.IO.File]::WriteAllText($appManifestPath, $appManifestXml, [System.Text.Encoding]::UTF8)
          Write-Host "✓ .exe.manifest gerado manualmente (sem customHostSpecified)"

          # ── Gera .application manualmente (sem mage.exe) ────────────────────
          # publicKeyToken=neutral é aceito pelo dfshim quando não há assinatura forte
          $verU   = $version.Replace('.','_')
          $relManifest = "Application Files/D365SupportAssistant_$verU/D365SupportAssistant.exe.manifest"
          $depXml  = '<?xml version="1.0" encoding="utf-8"?>' + "`r`n"
          $depXml += '<asmv1:assembly manifestVersion="1.0"' + "`r`n"
          $depXml += '  xmlns:asmv1="urn:schemas-microsoft-com:asm.v1"' + "`r`n"
          $depXml += '  xmlns="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $depXml += '  xmlns:asmv2="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $depXml += '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' + "`r`n"
          $depXml += '  xmlns:co.v1="urn:schemas-microsoft-com:clickonce.v1"' + "`r`n"
          $depXml += '  xmlns:co.v2="urn:schemas-microsoft-com:clickonce.v2">' + "`r`n"
          $depXml += "  <assemblyIdentity name=`"D365SupportAssistant.application`" version=`"$version`" publicKeyToken=`"0000000000000000`" language=`"neutral`" processorArchitecture=`"amd64`" xmlns=`"urn:schemas-microsoft-com:asm.v1`"/>`r`n"
          $depXml += "  <description asmv2:publisher=`"p4rzv4l`" asmv2:product=`"D365 Support Assistant`" asmv2:supportUrl=`"$installUrl`" xmlns=`"urn:schemas-microsoft-com:asm.v1`"/>`r`n"
          $depXml += '  <deployment install="true" mapFileExtensions="true">' + "`r`n"
          $depXml += '    <subscription><update><beforeApplicationStartup/></update></subscription>' + "`r`n"
          $depXml += "    <deploymentProvider codebase=`"${installUrl}D365SupportAssistant.application`"/>`r`n"
          $depXml += '  </deployment>' + "`r`n"
          $depXml += '  <compatibleFrameworks xmlns="urn:schemas-microsoft-com:clickonce.v2">' + "`r`n"
          $depXml += '    <framework targetVersion="4.0" profile="Full" supportedRuntime="4.0.30319"/>' + "`r`n"
          $depXml += '  </compatibleFrameworks>' + "`r`n"
          $depXml += '  <dependency>' + "`r`n"
          $depXml += '    <dependentAssembly dependencyType="install" codebase="' + $relManifest + '" size="1">' + "`r`n"
          $depXml += "      <assemblyIdentity name=`"D365SupportAssistant.exe`" version=`"$version`" language=`"neutral`" processorArchitecture=`"amd64`"/>`r`n"
          $depXml += '    </dependentAssembly>' + "`r`n"
          $depXml += '  </dependency>' + "`r`n"
          $depXml += '</asmv1:assembly>'
          [System.IO.File]::WriteAllText("$pagesDir\D365SupportAssistant.application", $depXml, [System.Text.Encoding]::UTF8)
          Write-Host "✓ Deployment manifest gerado manualmente"



          # Renomeia arquivos para .deploy (padrão ClickOnce)
          Get-ChildItem -Recurse $appDir |
            Where-Object { -not $_.PSIsContainer -and $_.Extension -ne ".manifest" } |
            ForEach-Object {
              $newName = $_.FullName + ".deploy"
              Rename-Item -Path $_.FullName -NewName $newName
            }
          Write-Host "✓ Arquivos renomeados para .deploy"

          # Lista resultado final
          Write-Host ""
          Write-Host "=== Conteúdo final de pages-out ==="
          Get-ChildItem -Recurse $pagesDir | Select-Object FullName

      # ── PASSO 3: Verificar que o .application foi gerado ──────────────────
      - name: Verificar .application
        shell: pwsh
        run: |
          $pagesDir = "${{ github.workspace }}\pages-out"
          $version  = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $appDir   = "$pagesDir\Application Files\D365SupportAssistant_$($version.Replace('.','_'))"
          $appFile  = Get-ChildItem $pagesDir -Filter "*.application" -ErrorAction SilentlyContinue
          if (-not $appFile) {
            Write-Error "✗ .application não encontrado em $pagesDir"
            exit 1
          }
          Write-Host "✓ $($appFile.Name) encontrado — OK"

          # ── Diagnóstico: mostra linhas com atributos suspeitos nos dois manifests ──
          Write-Host ""
          Write-Host "=== Grep: customHostSpecified / hostInBrowser ==="
          $manifests = @(
            "$appDir\D365SupportAssistant.exe.manifest",
            "$pagesDir\D365SupportAssistant.application"
          )
          foreach ($f in $manifests) {
            Write-Host "--- $(Split-Path $f -Leaf) ---"
            if (Test-Path $f) {
              $lines = [System.IO.File]::ReadAllLines($f)
              $hits  = $lines | Where-Object { $_ -match 'customHostSpecified|hostInBrowser|entryPoint' }
              if ($hits) { $hits | ForEach-Object { Write-Host $_ } }
              else        { Write-Host "(nenhum hit)" }
            } else {
              Write-Host "(arquivo não encontrado)"
            }
          }

      # ── PASSO 4: Criar index.html ─────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $date     = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest     = "${{ github.workspace }}\pages-out"
          $html  = '<!DOCTYPE html>'
          $html += '<html lang="pt-BR"><head>'
          $html += '<meta charset="UTF-8">'
          $html += '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          $html += '<title>D365 Support Assistant</title>'
          $html += '<style>'
          $html += '*{box-sizing:border-box;margin:0;padding:0}'
          $html += "body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;"
          $html += 'display:flex;align-items:center;justify-content:center;min-height:100vh}'
          $html += '.card{background:#161B22;border:1px solid #30363D;border-radius:12px;'
          $html += 'padding:40px 48px;max-width:560px;width:100%;text-align:center}'
          $html += '.logo{font-size:48px;margin-bottom:16px}'
          $html += 'h1{font-size:24px;font-weight:700;margin-bottom:8px}'
          $html += '.ver{display:inline-block;background:#7C3AED22;color:#A78BFA;'
          $html += 'border:1px solid #7C3AED55;border-radius:20px;'
          $html += 'padding:4px 16px;font-size:13px;margin-bottom:24px}'
          $html += 'p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}'
          $html += '.btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;'
          $html += 'padding:14px 32px;border-radius:8px;font-size:16px;'
          $html += 'font-weight:600;margin-bottom:12px}'
          $html += '.btn:hover{background:#6D28D9}'
          $html += '.btn2{display:block;color:#58A6FF;text-decoration:none;'
          $html += 'padding:10px 32px;border-radius:8px;font-size:14px;'
          $html += 'border:1px solid #30363D;margin-bottom:24px}'
          $html += '.note{background:#0D1117;border:1px solid #30363D;border-radius:8px;'
          $html += 'padding:12px 16px;font-size:12px;color:#484F58;text-align:left}'
          $html += '.note strong{color:#8B949E}'
          $html += '.date{font-size:11px;color:#30363D;margin-top:20px}'
          $html += '</style></head><body>'
          $html += '<div class="card">'
          $html += '<div class="logo">📊</div>'
          $html += '<h1>D365 Support Assistant</h1>'
          $html += "<span class=`"ver`">v$version</span>"
          $html += '<p>Monitor de chamados para Microsoft Dynamics 365.<br>'
          $html += 'Alertas automáticos, tracker de tempo e análise por IA.</p>'
          $html += '<a class="btn" href="D365SupportAssistant.application">⬇ Instalar via ClickOnce</a>'
          $html += '<a class="btn2" href="https://dotnet.microsoft.com/download/dotnet/8.0">📦 Baixar .NET 8 Runtime (necessário)</a>'
          $html += '<div class="note">'
          $html += '<strong>Requisitos:</strong> Windows 10/11 64-bit + .NET 8 Desktop Runtime<br><br>'
          $html += '<strong>Atualização automática:</strong> o app verifica novas versões ao iniciar.'
          $html += '</div>'
          $html += "<div class=`"date`">Publicado em $date · v$version</div>"
          $html += '</div></body></html>'
          [System.IO.File]::WriteAllText("$dest\index.html", $html, [System.Text.Encoding]::UTF8)
          Write-Host "✓ index.html criado"

      # ── Upload GitHub Pages ───────────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URLs finais
        run: |
          echo "================================================"
          echo "✅ Publicado com sucesso!"
          echo "📦 https://p4rzv4l.github.io/D365SupportAssistant/"
          echo "🔗 https://p4rzv4l.github.io/D365SupportAssistant/D365SupportAssistant.application"
          echo "================================================"