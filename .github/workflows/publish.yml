# =============================================================================
#  .github/workflows/publish.yml
#  Estratégia: dotnet publish normal → gera manifests ClickOnce separadamente
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Versão ────────────────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."
          echo "VERSION=$ver"                >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver → ClickOnce: $clickonce"

      # ── NuGet ─────────────────────────────────────────────────────────────
      - name: Restaurar NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── PASSO 1: dotnet publish normal (gera os binários) ─────────────────
      - name: Build e Publish binários
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $binDir     = "$workspace\bin-out"

          Write-Host "→ dotnet publish → $binDir"

          dotnet publish D365SupportAssistant.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$binDir" `
            --nologo

          if ($LASTEXITCODE -ne 0) {
            Write-Error "✗ dotnet publish falhou"
            exit 1
          }

          Write-Host "✓ Binários gerados em $binDir"
          Get-ChildItem $binDir | Select-Object Name | Format-Table -AutoSize

      # ── PASSO 2: Gerar manifests ClickOnce via mage.exe ──────────────────
      #
      #  mage.exe é a ferramenta oficial para criar manifests ClickOnce
      #  sem depender do target /t:Publish do MSBuild (que tem o bug MSB3094).
      #  Ela está incluída no SDK do VS Enterprise no runner.
      #
      - name: Gerar manifests ClickOnce com mage.exe
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $binDir     = "$workspace\bin-out"
          $appDir     = "$workspace\pages-out\Application Files\D365SupportAssistant_$($version.Replace('.','_'))"
          $pagesDir   = "$workspace\pages-out"

          New-Item -ItemType Directory -Force -Path $appDir  | Out-Null
          New-Item -ItemType Directory -Force -Path $pagesDir | Out-Null

          # Localizar mage.exe no VS
          $magePaths = @(
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\SDK\Bootstrapper\Packages",
            "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools",
            "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.7.2 Tools",
            "C:\Program Files (x86)\Microsoft SDKs\ClickOnce\SignTool"
          )

          $mage = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio\2022" `
                    -Filter "mage.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1

          if (-not $mage) {
            $mage = Get-ChildItem -Recurse "C:\Program Files (x86)\Microsoft SDKs" `
                      -Filter "mage.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }

          if ($mage) {
            Write-Host "✓ mage.exe encontrado: $($mage.FullName)"
          } else {
            Write-Host "⚠ mage.exe não encontrado — usando abordagem alternativa"
          }

          # Copia binários para a pasta de versão do ClickOnce
          Copy-Item -Recurse -Force "$binDir\*" "$appDir\"
          Write-Host "✓ Binários copiados para $appDir"

          if ($mage) {
            $mageExe = $mage.FullName

            # 1. Gera o manifest da aplicação (.exe.manifest)
            & $mageExe -New Application `
              -ToFile "$appDir\D365SupportAssistant.exe.manifest" `
              -Name "D365 Support Assistant" `
              -Version $version `
              -FromDirectory "$appDir" `
              -TrustLevel FullTrust

            Write-Host "✓ Application manifest gerado"

            # 2. Gera o deployment manifest (.application)
            & $mageExe -New Deployment `
              -ToFile "$pagesDir\D365SupportAssistant.application" `
              -Name "D365 Support Assistant" `
              -Version $version `
              -AppManifest "$appDir\D365SupportAssistant.exe.manifest" `
              -ProviderUrl "${installUrl}D365SupportAssistant.application" `
              -Install true `
              -Publisher "p4rzv4l" `
              -SupportUrl $installUrl

            Write-Host "✓ Deployment manifest gerado"

          } else {
            # Fallback: cria um .application mínimo manualmente
            Write-Host "→ Criando .application manualmente (fallback)"

            $appManifest = @"
            <?xml version="1.0" encoding="utf-8"?>
            <asmv1:assembly xsi:schemaLocation="urn:schemas-microsoft-com:asm.v1 assembly.adaptive.xsd"
              manifestVersion="1.0"
              xmlns:asmv1="urn:schemas-microsoft-com:asm.v1"
              xmlns="urn:schemas-microsoft-com:asm.v2"
              xmlns:asmv2="urn:schemas-microsoft-com:asm.v2"
              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xmlns:co.v1="urn:schemas-microsoft-com:clickonce.v1"
              xmlns:co.v2="urn:schemas-microsoft-com:clickonce.v2">
              <assemblyIdentity name="D365SupportAssistant.application"
                version="$version"
                publicKeyToken="0000000000000000"
                language="neutral"
                processorArchitecture="amd64"
                xmlns="urn:schemas-microsoft-com:asm.v1" />
              <description asmv2:publisher="p4rzv4l"
                asmv2:product="D365 Support Assistant"
                asmv2:supportUrl="$installUrl"
                xmlns="urn:schemas-microsoft-com:asm.v1" />
              <deployment install="true" mapFileExtensions="true">
                <subscription>
                  <update>
                    <beforeApplicationStartup />
                  </update>
                </subscription>
                <deploymentProvider codebase="${installUrl}D365SupportAssistant.application" />
              </deployment>
              <compatibleFrameworks xmlns="urn:schemas-microsoft-com:clickonce.v2">
                <framework targetVersion="4.0" profile="Full" supportedRuntime="4.0.30319" />
              </compatibleFrameworks>
              <dependency>
                <dependentAssembly dependencyType="install"
                  codebase="Application Files\D365SupportAssistant_$($version.Replace('.','_'))\D365SupportAssistant.exe.manifest"
                  size="1">
                  <assemblyIdentity name="D365SupportAssistant.exe"
                    version="$version"
                    language="neutral"
                    processorArchitecture="amd64" />
                  <hash>
                    <dsig:Transforms xmlns:dsig="http://www.w3.org/2000/09/xmldsig#">
                      <dsig:Transform Algorithm="urn:schemas-microsoft-com:HashTransforms.Identity" />
                    </dsig:Transforms>
                    <dsig:DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha256"
                      xmlns:dsig="http://www.w3.org/2000/09/xmldsig#" />
                    <dsig:DigestValue xmlns:dsig="http://www.w3.org/2000/09/xmldsig#">AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=</dsig:DigestValue>
                  </hash>
                </dependentAssembly>
              </dependency>
            </asmv1:assembly>
            "@
            $appManifest | Out-File -FilePath "$pagesDir\D365SupportAssistant.application" -Encoding UTF8
            Write-Host "✓ .application criado (fallback)"
          }

          # Renomeia arquivos para .deploy (padrão ClickOnce)
          Get-ChildItem -Recurse $appDir |
            Where-Object { -not $_.PSIsContainer -and $_.Extension -ne ".manifest" } |
            ForEach-Object {
              $newName = $_.FullName + ".deploy"
              Rename-Item -Path $_.FullName -NewName $newName
            }
          Write-Host "✓ Arquivos renomeados para .deploy"

          # Lista resultado final
          Write-Host ""
          Write-Host "=== Conteúdo final de pages-out ==="
          Get-ChildItem -Recurse $pagesDir | Select-Object FullName

      # ── PASSO 3: Verificar que o .application foi gerado ──────────────────
      - name: Verificar .application
        shell: pwsh
        run: |
          $pagesDir = "${{ github.workspace }}\pages-out"
          $appFile  = Get-ChildItem $pagesDir -Filter "*.application" -ErrorAction SilentlyContinue

          if (-not $appFile) {
            Write-Error "✗ .application não encontrado em $pagesDir"
            exit 1
          }
          Write-Host "✓ $($appFile.Name) encontrado — OK"

      # ── PASSO 4: Criar index.html ─────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $date     = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest     = "${{ github.workspace }}\pages-out"

          $html = @"
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>D365 Support Assistant</title>
            <style>
              *{box-sizing:border-box;margin:0;padding:0}
              body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;
                   display:flex;align-items:center;justify-content:center;min-height:100vh}
              .card{background:#161B22;border:1px solid #30363D;border-radius:12px;
                    padding:40px 48px;max-width:560px;width:100%;text-align:center}
              .logo{font-size:48px;margin-bottom:16px}
              h1{font-size:24px;font-weight:700;margin-bottom:8px}
              .ver{display:inline-block;background:#7C3AED22;color:#A78BFA;
                   border:1px solid #7C3AED55;border-radius:20px;
                   padding:4px 16px;font-size:13px;margin-bottom:24px}
              p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}
              .btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;
                   padding:14px 32px;border-radius:8px;font-size:16px;
                   font-weight:600;margin-bottom:12px}
              .btn:hover{background:#6D28D9}
              .btn2{display:block;color:#58A6FF;text-decoration:none;
                    padding:10px 32px;border-radius:8px;font-size:14px;
                    border:1px solid #30363D;margin-bottom:24px}
              .note{background:#0D1117;border:1px solid #30363D;border-radius:8px;
                    padding:12px 16px;font-size:12px;color:#484F58;text-align:left}
              .note strong{color:#8B949E}
              .date{font-size:11px;color:#30363D;margin-top:20px}
            </style>
          </head>
          <body>
            <div class="card">
              <div class="logo">📊</div>
              <h1>D365 Support Assistant</h1>
              <span class="ver">v$version</span>
              <p>Monitor de chamados para Microsoft Dynamics 365.<br>
                 Alertas automáticos, tracker de tempo e análise por IA.</p>
              <a class="btn" href="D365SupportAssistant.application">
                ⬇ Instalar via ClickOnce
              </a>
              <a class="btn2" href="https://dotnet.microsoft.com/download/dotnet/8.0">
                📦 Baixar .NET 8 Runtime (necessário)
              </a>
              <div class="note">
                <strong>Requisitos:</strong> Windows 10/11 64-bit + .NET 8 Desktop Runtime<br><br>
                <strong>Atualização automática:</strong> o app verifica novas versões ao iniciar.
              </div>
              <div class="date">Publicado em $date · v$version</div>
            </div>
          </body>
          </html>
          "@

          $html | Out-File -FilePath "$dest\index.html" -Encoding UTF8
          Write-Host "✓ index.html criado"

      # ── Upload GitHub Pages ───────────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URLs finais
        run: |
          echo "================================================"
          echo "✅ Publicado com sucesso!"
          echo "📦 https://p4rzv4l.github.io/D365SupportAssistant/"
          echo "🔗 https://p4rzv4l.github.io/D365SupportAssistant/D365SupportAssistant.application"
          echo "================================================"