# =============================================================================
#  .github/workflows/publish.yml
#  Estratégia: dotnet publish normal → gera manifests ClickOnce separadamente
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Versão ────────────────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."
          echo "VERSION=$ver"                >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $ver → ClickOnce: $clickonce"

      # ── NuGet ─────────────────────────────────────────────────────────────
      - name: Restaurar NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── PASSO 1: dotnet publish normal (gera os binários) ─────────────────
      - name: Build e Publish binários
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $binDir     = "$workspace\bin-out"
          Write-Host "→ dotnet publish → $binDir"
          dotnet publish D365SupportAssistant.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output "$binDir" `
            --nologo
          if ($LASTEXITCODE -ne 0) {
            Write-Error "✗ dotnet publish falhou"
            exit 1
          }
          Write-Host "✓ Binários gerados em $binDir"
          Get-ChildItem $binDir | Select-Object Name | Format-Table -AutoSize

      # ── PASSO 2: Gerar certificado auto-assinado ──────────────────────────
      - name: Gerar certificado auto-assinado para ClickOnce
        id: cert
        shell: pwsh
        run: |
          $certPath = "${{ github.workspace }}\clickonce.pfx"
          $pwd      = ConvertTo-SecureString "ClickOnce123!" -AsPlainText -Force

          # Gera certificado auto-assinado válido por 10 anos
          $cert = New-SelfSignedCertificate `
            -Subject "CN=D365SupportAssistant" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -KeySpec Signature `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddYears(10) `
            -Type CodeSigningCert

          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $pwd | Out-Null
          Write-Host "✓ Certificado gerado: $certPath"
          Write-Host "  Thumbprint: $($cert.Thumbprint)"
          echo "CERT_PATH=$certPath"       >> $env:GITHUB_OUTPUT
          echo "CERT_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # ── PASSO 3: Gerar manifests ClickOnce e assinar ──────────────────────
      - name: Gerar e assinar manifests ClickOnce
        shell: pwsh
        run: |
          $workspace  = "${{ github.workspace }}"
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $binDir     = "$workspace\bin-out"
          $appDir     = "$workspace\pages-out\Application Files\D365SupportAssistant_$($version.Replace('.','_'))"
          $pagesDir   = "$workspace\pages-out"
          $certPath   = "${{ steps.cert.outputs.CERT_PATH }}"
          $certPwd    = "ClickOnce123!"

          New-Item -ItemType Directory -Force -Path $appDir  | Out-Null
          New-Item -ItemType Directory -Force -Path $pagesDir | Out-Null

          # Localizar mage.exe
          $mage = Get-ChildItem -Recurse "C:\Program Files\Microsoft Visual Studio\2022" `
                    -Filter "mage.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mage) {
            $mage = Get-ChildItem -Recurse "C:\Program Files (x86)\Microsoft SDKs" `
                      -Filter "mage.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $mage) { Write-Error "✗ mage.exe não encontrado"; exit 1 }
          $mageExe = $mage.FullName
          Write-Host "✓ mage.exe: $mageExe"

          # Copia binários para a pasta de versão do ClickOnce
          Copy-Item -Recurse -Force "$binDir\*" "$appDir\"
          Write-Host "✓ Binários copiados para $appDir"

          # 1. Gera o application manifest via mage
          & $mageExe -New Application `
            -ToFile "$appDir\D365SupportAssistant.exe.manifest" `
            -Name "D365 Support Assistant" `
            -Version $version `
            -FromDirectory "$appDir" `
            -TrustLevel FullTrust
          Write-Host "✓ Application manifest gerado"

          $appManPath = "$appDir\D365SupportAssistant.exe.manifest"

          # ── Lê o manifest gerado pelo mage para diagnóstico ────────────────
          $xml = [System.IO.File]::ReadAllText($appManPath)
          Write-Host "=== manifest completo (primeiros 80 chars por linha) ==="
          $xml -split "`n" | ForEach-Object { Write-Host $_.Substring(0, [Math]::Min($_.Length,120)) }
          Write-Host "=== fim manifest ==="

          # ── Descobre o nome real do assembly lendo o PE ────────────────────
          $asmName = [System.Reflection.AssemblyName]::GetAssemblyName("$appDir\D365SupportAssistant.dll").Name
          Write-Host "✓ Nome real do assembly: $asmName"

          # ── Reconstrói o manifest do zero com dados corretos ───────────────
          # Coleta todos os arquivos e seus hashes para a seção <file>
          $fileSection = ''
          Get-ChildItem -Recurse $appDir -File |
            Where-Object { $_.Extension -ne '.manifest' } |
            ForEach-Object {
              $rel  = $_.FullName.Substring($appDir.Length + 1).Replace('\','/')
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $b64  = [Convert]::ToBase64String(
                        [byte[]]($hash -split '(?<=\G..)' | Where-Object {$_} | ForEach-Object {[Convert]::ToByte($_, 16)})
                      )
              $sz   = $_.Length
              $fileSection += "  <file name=`"$rel.deploy`" size=`"$sz`">`r`n"
              $fileSection += "    <hash>`r`n"
              $fileSection += "      <dsig:Transforms xmlns:dsig=`"http://www.w3.org/2000/09/xmldsig#`"><dsig:Transform Algorithm=`"urn:schemas-microsoft-com:HashTransforms.Identity`"/></dsig:Transforms>`r`n"
              $fileSection += "      <dsig:DigestMethod xmlns:dsig=`"http://www.w3.org/2000/09/xmldsig#`" Algorithm=`"http://www.w3.org/2000/09/xmldsig#sha256`"/>`r`n"
              $fileSection += "      <dsig:DigestValue xmlns:dsig=`"http://www.w3.org/2000/09/xmldsig#`">$b64</dsig:DigestValue>`r`n"
              $fileSection += "    </hash>`r`n"
              $fileSection += "  </file>`r`n"
            }

          $newManifest  = '<?xml version="1.0" encoding="utf-8"?>' + "`r`n"
          $newManifest += '<asmv1:assembly manifestVersion="1.0"' + "`r`n"
          $newManifest += '  xmlns:asmv1="urn:schemas-microsoft-com:asm.v1"' + "`r`n"
          $newManifest += '  xmlns="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $newManifest += '  xmlns:asmv2="urn:schemas-microsoft-com:asm.v2"' + "`r`n"
          $newManifest += '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' + "`r`n"
          $newManifest += "  <assemblyIdentity name=`"$asmName`" version=`"$version`" language=`"neutral`" processorArchitecture=`"amd64`" type=`"win32`" xmlns=`"urn:schemas-microsoft-com:asm.v1`"/>`r`n"
          $newManifest += '  <application/>' + "`r`n"
          $newManifest += '  <entryPoint>' + "`r`n"
          $newManifest += "    <assemblyIdentity name=`"$asmName`" version=`"$version`" language=`"neutral`" processorArchitecture=`"amd64`"/>`r`n"
          $newManifest += "    <commandLine file=`"D365SupportAssistant.exe`" parameters=`"`"/>`r`n"
          $newManifest += '  </entryPoint>' + "`r`n"
          $newManifest += '  <trustInfo xmlns="urn:schemas-microsoft-com:asm.v2">' + "`r`n"
          $newManifest += '    <security><applicationRequestMinimum>' + "`r`n"
          $newManifest += '      <PermissionSet Unrestricted="true" ID="Custom" SameSite="site"/>' + "`r`n"
          $newManifest += '      <defaultAssemblyRequest permissionSetReference="Custom"/>' + "`r`n"
          $newManifest += '    </applicationRequestMinimum></security>' + "`r`n"
          $newManifest += '  </trustInfo>' + "`r`n"
          $newManifest += $fileSection
          $newManifest += '</asmv1:assembly>'
          [System.IO.File]::WriteAllText($appManPath, $newManifest, [System.Text.Encoding]::UTF8)
          Write-Host "✓ Application manifest reconstruído do zero"

          # ── Assina o manifest reconstruído ─────────────────────────────────
          & $mageExe -Sign "$appManPath" -CertFile "$certPath" -Password "$certPwd"
          Write-Host "✓ Application manifest assinado"

          # ── Renomeia arquivos para .deploy ─────────────────────────────────
          Get-ChildItem -Recurse $appDir |
            Where-Object { -not $_.PSIsContainer -and $_.Extension -ne ".manifest" } |
            ForEach-Object { Rename-Item -Path $_.FullName -NewName ($_.FullName + ".deploy") }
          Write-Host "✓ Arquivos renomeados para .deploy"

          # ── Gera deployment manifest ───────────────────────────────────────
          & $mageExe -New Deployment `
            -ToFile "$pagesDir\D365SupportAssistant.application" `
            -Name "D365 Support Assistant" `
            -Version $version `
            -AppManifest "$appManPath" `
            -ProviderUrl "${installUrl}D365SupportAssistant.application" `
            -Install true `
            -Publisher "p4rzv4l" `
            -SupportUrl $installUrl
          Write-Host "✓ Deployment manifest gerado"

          # ── Assina o deployment manifest ───────────────────────────────────
          & $mageExe -Sign "$pagesDir\D365SupportAssistant.application" `
            -CertFile "$certPath" -Password "$certPwd"
          Write-Host "✓ Deployment manifest assinado"

          # Lista resultado final
          Write-Host ""
          Write-Host "=== Conteúdo final de pages-out ==="
          Get-ChildItem -Recurse $pagesDir | Select-Object FullName

      # ── PASSO 4: Verificar que o .application foi gerado ──────────────────
      - name: Verificar .application
        shell: pwsh
        run: |
          $pagesDir = "${{ github.workspace }}\pages-out"
          $appFile  = Get-ChildItem $pagesDir -Filter "*.application" -ErrorAction SilentlyContinue
          if (-not $appFile) {
            Write-Error "✗ .application não encontrado em $pagesDir"
            exit 1
          }
          Write-Host "✓ $($appFile.Name) encontrado — OK"

      # ── PASSO 5: Criar index.html ──────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version  = "${{ steps.version.outputs.VERSION }}"
          $date     = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest     = "${{ github.workspace }}\pages-out"
          $html  = '<!DOCTYPE html>'
          $html += '<html lang="pt-BR"><head>'
          $html += '<meta charset="UTF-8">'
          $html += '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          $html += '<title>D365 Support Assistant</title>'
          $html += '<style>'
          $html += '*{box-sizing:border-box;margin:0;padding:0}'
          $html += "body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;"
          $html += 'display:flex;align-items:center;justify-content:center;min-height:100vh}'
          $html += '.card{background:#161B22;border:1px solid #30363D;border-radius:12px;'
          $html += 'padding:40px 48px;max-width:560px;width:100%;text-align:center}'
          $html += '.logo{font-size:48px;margin-bottom:16px}'
          $html += 'h1{font-size:24px;font-weight:700;margin-bottom:8px}'
          $html += '.ver{display:inline-block;background:#7C3AED22;color:#A78BFA;'
          $html += 'border:1px solid #7C3AED55;border-radius:20px;'
          $html += 'padding:4px 16px;font-size:13px;margin-bottom:24px}'
          $html += 'p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}'
          $html += '.btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;'
          $html += 'padding:14px 32px;border-radius:8px;font-size:16px;'
          $html += 'font-weight:600;margin-bottom:12px}'
          $html += '.btn:hover{background:#6D28D9}'
          $html += '.btn2{display:block;color:#58A6FF;text-decoration:none;'
          $html += 'padding:10px 32px;border-radius:8px;font-size:14px;'
          $html += 'border:1px solid #30363D;margin-bottom:24px}'
          $html += '.note{background:#0D1117;border:1px solid #30363D;border-radius:8px;'
          $html += 'padding:12px 16px;font-size:12px;color:#484F58;text-align:left}'
          $html += '.note strong{color:#8B949E}'
          $html += '.date{font-size:11px;color:#30363D;margin-top:20px}'
          $html += '</style></head><body>'
          $html += '<div class="card">'
          $html += '<div class="logo">📊</div>'
          $html += '<h1>D365 Support Assistant</h1>'
          $html += "<span class=`"ver`">v$version</span>"
          $html += '<p>Monitor de chamados para Microsoft Dynamics 365.<br>'
          $html += 'Alertas automáticos, tracker de tempo e análise por IA.</p>'
          $html += '<a class="btn" href="D365SupportAssistant.application">⬇ Instalar via ClickOnce</a>'
          $html += '<a class="btn2" href="https://dotnet.microsoft.com/download/dotnet/8.0">📦 Baixar .NET 8 Runtime (necessário)</a>'
          $html += '<div class="note">'
          $html += '<strong>Requisitos:</strong> Windows 10/11 64-bit + .NET 8 Desktop Runtime<br><br>'
          $html += '<strong>Atualização automática:</strong> o app verifica novas versões ao iniciar.'
          $html += '</div>'
          $html += "<div class=`"date`">Publicado em $date · v$version</div>"
          $html += '</div></body></html>'
          [System.IO.File]::WriteAllText("$dest\index.html", $html, [System.Text.Encoding]::UTF8)
          Write-Host "✓ index.html criado"

      # ── Upload GitHub Pages ───────────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: URLs finais
        run: |
          echo "================================================"
          echo "✅ Publicado com sucesso!"
          echo "📦 https://p4rzv4l.github.io/D365SupportAssistant/"
          echo "🔗 https://p4rzv4l.github.io/D365SupportAssistant/D365SupportAssistant.application"
          echo "================================================"