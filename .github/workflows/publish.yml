# =============================================================================
#  .github/workflows/publish.yml
# =============================================================================

name: Publicar D365 Support Assistant

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build e Publicar ClickOnce
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── Determinar versão ──────────────────────────────────────────────────
      - name: Determinar versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }

          # Garante formato X.Y.Z.BUILD para o ClickOnce
          $parts = $ver.Split(".")
          while ($parts.Count -lt 4) { $parts += "0" }
          $clickonce = $parts[0..3] -join "."

          echo "VERSION=$ver"               >> $env:GITHUB_OUTPUT
          echo "CLICKONCE_VERSION=$clickonce" >> $env:GITHUB_OUTPUT
          Write-Host "✓ Versão: $ver  →  ClickOnce: $clickonce"

      # ── Restaurar NuGet ────────────────────────────────────────────────────
      - name: Restaurar pacotes NuGet
        run: dotnet restore D365SupportAssistant.csproj -r win-x64

      # ── Publicar ClickOnce via MSBuild ────────────────────────────────────
      #
      #  IMPORTANTE:
      #   - Usamos MSBuild diretamente (não dotnet publish) porque ClickOnce
      #     requer o target "Publish" do MSBuild clássico.
      #   - SignManifests=false: sem certificado por enquanto.
      #   - GenerateBootstrapper=false: não gera setup.exe (requer componentes
      #     extras do VS — usaremos só o .application para instalação via URL).
      #
      - name: Publicar ClickOnce
        shell: pwsh
        run: |
          $version    = "${{ steps.version.outputs.CLICKONCE_VERSION }}"
          $installUrl = "https://p4rzv4l.github.io/D365SupportAssistant/"
          $publishDir = "${{ github.workspace }}\clickonce-out\"

          Write-Host "→ Versão ClickOnce : $version"
          Write-Host "→ Install URL      : $installUrl"
          Write-Host "→ Publish Dir      : $publishDir"

          msbuild D365SupportAssistant.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PublishDir="$publishDir" `
            /p:InstallUrl="$installUrl" `
            /p:ApplicationVersion="$version" `
            /p:UpdateEnabled=true `
            /p:UpdateMode=Foreground `
            /p:MapFileExtensions=true `
            /p:SignManifests=false `
            /p:GenerateBootstrapper=false `
            /p:BootstrapperEnabled=false `
            /p:PublisherName="p4rzv4l" `
            /p:ProductName="D365 Support Assistant" `
            /p:SupportUrl="$installUrl" `
            /p:TargetFramework=net8.0-windows10.0.17763.0 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=false `
            /nologo

          if ($LASTEXITCODE -ne 0) {
            Write-Error "✗ MSBuild falhou (código $LASTEXITCODE)"
            exit 1
          }

          Write-Host "✓ MSBuild concluído"

      # ── Verificar saída ────────────────────────────────────────────────────
      - name: Verificar arquivos ClickOnce
        shell: pwsh
        run: |
          $publishDir = "${{ github.workspace }}\clickonce-out\"

          Write-Host "=== Conteúdo de $publishDir ==="
          Get-ChildItem -Recurse $publishDir | Select-Object FullName

          $appFile = Get-ChildItem $publishDir -Filter "*.application" -Recurse -ErrorAction SilentlyContinue
          if (-not $appFile) {
            Write-Error "✗ Arquivo .application não encontrado! Verifique os logs do MSBuild acima."
            exit 1
          }
          Write-Host "✓ Encontrado: $($appFile.FullName)"

      # ── Preparar pasta final para o Pages ─────────────────────────────────
      - name: Preparar pasta de deploy
        shell: pwsh
        run: |
          $src  = "${{ github.workspace }}\clickonce-out\"
          $dest = "${{ github.workspace }}\pages-out\"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # Copia tudo que o ClickOnce gerou
          Copy-Item -Recurse -Force "$src*" $dest

          Write-Host "✓ Arquivos copiados para $dest"
          Get-ChildItem $dest | Select-Object Name

      # ── Criar página de download ───────────────────────────────────────────
      - name: Criar index.html
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $date    = (Get-Date -Format "dd/MM/yyyy HH:mm")
          $dest    = "${{ github.workspace }}\pages-out\"

          $html = @"
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>D365 Support Assistant</title>
            <style>
              *{box-sizing:border-box;margin:0;padding:0}
              body{font-family:'Segoe UI',sans-serif;background:#0D1117;color:#E6EDF3;
                   display:flex;align-items:center;justify-content:center;min-height:100vh}
              .card{background:#161B22;border:1px solid #30363D;border-radius:12px;
                    padding:40px 48px;max-width:560px;width:100%;text-align:center}
              .logo{font-size:48px;margin-bottom:16px}
              h1{font-size:24px;font-weight:700;margin-bottom:8px}
              .ver{display:inline-block;background:#7C3AED22;color:#A78BFA;
                   border:1px solid #7C3AED55;border-radius:20px;
                   padding:4px 16px;font-size:13px;margin-bottom:24px}
              p{color:#8B949E;font-size:14px;line-height:1.6;margin-bottom:24px}
              .btn{display:block;background:#7C3AED;color:#fff;text-decoration:none;
                   padding:14px 32px;border-radius:8px;font-size:16px;
                   font-weight:600;margin-bottom:12px}
              .btn:hover{background:#6D28D9}
              .note{background:#0D1117;border:1px solid #30363D;border-radius:8px;
                    padding:12px 16px;font-size:12px;color:#484F58;text-align:left}
              .note strong{color:#8B949E}
              .date{font-size:11px;color:#30363D;margin-top:20px}
            </style>
          </head>
          <body>
            <div class="card">
              <div class="logo">📊</div>
              <h1>D365 Support Assistant</h1>
              <span class="ver">v$version</span>
              <p>Monitor de chamados para Microsoft Dynamics 365.<br>
                 Alertas automáticos, tracker de tempo e análise por IA.</p>
              <a class="btn" href="D365SupportAssistant.application">
                ⬇ Instalar via ClickOnce
              </a>
              <div class="note">
                <strong>Requisito:</strong> Windows 10/11 64-bit + 
                <a href="https://dotnet.microsoft.com/download/dotnet/8.0" 
                   style="color:#58A6FF">.NET 8 Desktop Runtime</a><br><br>
                <strong>Atualização automática:</strong> o app verifica por novas 
                versões ao iniciar e atualiza sozinho.
              </div>
              <div class="date">Publicado em $date · v$version</div>
            </div>
          </body>
          </html>
          "@

          $html | Out-File -FilePath "${dest}index.html" -Encoding UTF8
          Write-Host "✓ index.html criado"

      # ── Upload para GitHub Pages ───────────────────────────────────────────
      - name: Upload para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-out

  # ── Deploy ────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GitHub Pages
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Exibir URLs
        run: |
          echo "================================================"
          echo "✅ Publicado com sucesso!"
          echo ""
          echo "📦 Página: https://p4rzv4l.github.io/D365SupportAssistant/"
          echo "🔗 Install: https://p4rzv4l.github.io/D365SupportAssistant/D365SupportAssistant.application"
          echo "================================================"